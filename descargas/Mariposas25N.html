unio.`]],Re=[[`Control`,`Vigilar amistades, invadir la privacidad o limitar decisiones.`,`Exigir la contraseña del celular e insistir en leer conversaciones privadas.`],[`Violencia psicológica`,`Amenazar, humillar, intimidar o manipular.`,`Usar burlas frecuentes para desacreditar a la pareja frente a otras personas.`],[`Violencia económica`,`Usar dinero o recursos para restringir la autonomía.`,`Retener los ingresos de la pareja para impedirle decidir sobre sus gastos.`],[`Violencia digital`,`Acosar, vigilar, amenazar o difundir contenido privado en línea.`,`Compartir una imagen íntima sin el consentimiento de quien aparece en ella.`]],ze=[[`Una amiga te cuenta que salió de una relación violenta y te pide que guardes discreción. Otra persona del grupo insiste en avisar a su familia por su bien. ¿Qué harías primero?`,[`Avisar a la familia sin identificar a tu amiga.`,`Preguntarle qué apoyo quiere y acordar con ella cómo contactarla de forma segura.`,`Proponerle que cuente su historia al grupo para organizar ayuda.`],1,`Ella conoce mejor su situación. Acordar una forma segura de contacto y ofrecer opciones respeta su autonomía.`],[`En una fiesta, un compañero insiste en acercarse a una chica que se aparta varias veces. Dice que solo está coqueteando. ¿Cómo puedes intervenir?`,[`Pedirle a ella que se lo explique con más claridad.`,`Esperar a que el grupo esté de acuerdo antes de intervenir.`,`Interrumpir con una excusa y preguntarle en privado si quiere compañía o ayuda.`],2,`Una interrupción discreta puede darle margen para decidir qué hacer. Apartarse también comunica un límite.`],[`Dos personas acuerdan que una se encargue de los gastos mientras la otra estudia. Meses después, quien aporta el dinero amenaza con dejar de pagar la matrícula si su pareja acepta una pasantía. ¿Qué distingue esta situación?`,[`El dinero se usa como presión para decidir sobre los estudios o el trabajo de la otra persona.`,`El problema es que los dos deberían aportar exactamente lo mismo.`,`La amenaza es una forma válida de renegociar un presupuesto compartido.`],0,`Un acuerdo económico puede ser desigual y seguir siendo voluntario. Aquí la amenaza condiciona la libertad de decidir.`],[`En un grupo de clase, varios compañeros se ríen cuando uno dice que su amigo es «menos hombre» por llorar. El amigo cambia de tema. ¿Cuál es una respuesta útil?`,[`Cambiar de tema para que la broma se olvide.`,`Cuestionar la broma sin pedirle al amigo que explique lo que siente.`,`Pedirle al amigo que diga delante de todos si le molestó.`],1,`Cuestionar la burla pone el foco en la presión por aparentar dureza y evita exponer a quien la recibió.`]],Be=[[`Escuchar sin juzgar`,`Acompaña con respeto y escucha qué tipo de apoyo quiere la persona.`],[`Cuestionar el control y los estereotipos`,`Si alguien convierte una burla en costumbre, señala su efecto y abre la conversación.`],[`Buscar información y apoyo`,`Consulta recursos oficiales y comparte información verificada.`]],Ve={title:`No estás sola. Mereces vivir con seguridad, respeto y libertad.`,label:`Ministerio de la Mujer · Línea de Emergencia *212`,url:`https://www.mujer.gob.do/index.php/servicios/linea-mujer-212`,reflection:`Recordar a las hermanas Mirabal nos invita a defender la libertad de las mujeres y a asumir, en comunidad, la responsabilidad de prevenir la violencia.`},He=e((e=>{var t=Symbol.for(`react.transitional.element`),n=Symbol.for(`react.fragment`);function r(e,n,r){var i=null;if(r!==void 0&&(i=``+r),n.key!==void 0&&(i=``+n.key),`key`in n)for(var a in r={},n)a!==`key`&&(r[a]=n[a]);else r=n;return n=r.ref,{$$typeof:t,type:e,key:i,ref:n===void 0?null:n,props:r}}e.Fragment=n,e.jsx=r,e.jsxs=r})),O=e(((e,t)=>{t.exports=He()}))();function Ue(){return(0,O.jsxs)(`a`,{className:`brand`,href:`#inicio`,children:[(0,O.jsx)(`img`,{src:`data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA0OCA0OCI+PHJlY3Qgd2lkdGg9IjQ4IiBoZWlnaHQ9IjQ4IiByeD0iMTIiIGZpbGw9IiM2NDNlODQiLz48cGF
